<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
            background: linear-gradient(135deg, #0f172a, #111827, #1f2937);
            font-family: Arial, sans-serif;
            color: #f8fafc;
        }

        .todo-app {
            width: 100%;
            max-width: 500px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 18px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
            padding: 24px;
        }

        .todo-input-row {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        #todoinput {
            flex: 1;
            padding: 14px 16px;
            border: 1px solid #475569;
            border-radius: 12px;
            background: #0f172a;
            color: #f8fafc;
            font-size: 16px;
            outline: none;
        }

        #todoinput:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        #CreateButton {
            padding: 14px 18px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        #CreateButton:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(34, 197, 94, 0.35);
        }

        #todocont {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #todocont li {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 10px;
            padding: 12px 14px;
            color: #e2e8f0;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
            word-break: break-word;
        }

        #todocont li:hover {
            background: rgba(51, 65, 85, 0.9);
            transform: translateX(2px);
        }
    </style>
</head>
<body>
     <div class="todo-app">
        <div class="todo-input-row">
            <input id="todoinput" type="text" placeholder="Enter your task here" />
            <button id="CreateButton">Create</button>
        </div>

        <div>
            <ul id="todocont"></ul>
        </div>
     </div>
      <script>
     const BTNref=document.getElementById("CreateButton");
     const todoinpurREF=document.getElementById("todoinput");
    const todocontREF=document.getElementById("todocont");

      BTNref.addEventListener("click",function(){
        console.log("button is clicked")
      const value= todoinpurREF.value;
     console.log(value);

     const li=document.createElement('li');
     li.addEventListener("click",function(){
        li.remove();
      //  li=null;
     })
     // bc
     li.innerText=value;
     todocontREF.append(li);
     todoinpurREF.value="";
     
    /// at:2:34
        
      });

      </script> 
</body>
</html>
